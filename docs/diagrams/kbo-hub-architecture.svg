<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-labelledby="title desc">
<title id="title">KBO-Hub high-level architecture</title><desc id="desc">Client connects to a Next.js application, then approved auth and server boundaries connect to Supabase services, which are served in Cloudflare production.</desc>
<style>text{font-family:Arial,sans-serif;fill:#e2e8f0}.h{font-size:27px;font-weight:700}.b{font-size:18px}.box{fill:#121a29;stroke:#38bdf8;stroke-width:2}.muted{fill:#94a3b8;font-size:15px}.arrow{stroke:#67e8f9;stroke-width:3;marker-end:url(#a)}</style><defs><marker id="a" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><path d="M0 0 10 3.5 0 7z" fill="#67e8f9"/></marker></defs><rect width="1200" height="420" fill="#0a0d14" rx="24"/><text x="50" y="66" class="h">KBO-Hub · High-level architecture</text>
<rect x="55" y="150" width="180" height="100" rx="14" class="box"/><text x="109" y="195" class="h">Client</text><text x="81" y="224" class="muted">Web browser</text>
<rect x="330" y="130" width="230" height="140" rx="14" class="box"/><text x="365" y="182" class="h">Next.js</text><text x="365" y="213" class="b">Application</text><text x="365" y="242" class="muted">Auth / server boundary</text>
<rect x="655" y="105" width="215" height="190" rx="14" class="box"/><text x="710" y="155" class="h">Supabase</text><text x="686" y="192" class="b">PostgreSQL · RLS</text><text x="686" y="222" class="b">Storage</text>
<rect x="965" y="150" width="180" height="100" rx="14" class="box"/><text x="1001" y="195" class="h">Cloudflare</text><text x="995" y="224" class="muted">Production</text>
